[project]
name = "model-probe"
version = "0.1.0"
description = "Probe provider models for real vision capability and fill per-model modality into ~/.agents/crow/config.yaml. Invoke via `uv --project ~/.agents/skills/model-probe run python scripts/probe_models.py`."
requires-python = ">=3.14"
dependencies = [
    "crow-cli>=0.1.33",
]

[tool.uv]
# This is a dependency environment, not an installable package.
package = false
