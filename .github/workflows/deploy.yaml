name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Build mkdocs site
        run: uv --project site run mkdocs build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Landing page and assets
          cp index.html _site/
          cp style.css _site/
          cp main.js _site/
          cp task-loop-viz.js _site/
          cp install.sh _site/
          cp icon.ico _site/
          cp crow-icon-white.ico _site/
          cp crow-icon-white.svg _site/
          cp crow-logo.svg _site/
          cp oauth-client-metadata.json _site/
          # mkdocs docs (human-readable, includes rendered skills) at /docs
          cp -r site-build _site/docs
          # raw fetchable skill files at /skills (SKILL.md, pyproject.toml, ...)
          cp -r site-src/skills _site/skills
          # llms.txt index
          cp llms.txt _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
